<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Path: Ace Organic Inspector</title>
<style>
:root{--navy:#101836;--blue:#244a8f;--gold:#ffcc45;--red:#df2c35;--cream:#fff9e9;--ink:#172039;--green:#2e8b57}
*{box-sizing:border-box} body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#0b1023;color:white;overflow-x:hidden}
button{font:inherit}.app{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;background-size:cover;background-position:center;transition:background .5s ease}
.app::before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(4,9,22,.16),rgba(4,9,22,.66));pointer-events:none}
header,main,footer{position:relative;z-index:1}
header{display:flex;gap:18px;align-items:center;justify-content:space-between;padding:13px 22px;background:rgba(9,15,38,.88);border-bottom:3px solid var(--gold)}
.brand{font-weight:900;letter-spacing:.5px}.brand small{display:block;color:#a9badf;font-weight:600}.hud{display:flex;gap:14px;align-items:center}.meter{width:190px;height:18px;border:2px solid white;background:#350d18;border-radius:20px;overflow:hidden}.meter>div{height:100%;background:linear-gradient(90deg,#e9303a,#ffce4e,#58d36a);transition:width .45s}.chapter{font-weight:800;color:var(--gold)}
main{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px;align-items:end;padding:24px;max-width:1280px;width:100%;margin:auto}
.stage{min-height:600px;display:flex;flex-direction:column;justify-content:flex-end}.scene-title{align-self:flex-start;padding:8px 16px;background:rgba(10,21,49,.88);border-left:6px solid var(--gold);font-weight:900;letter-spacing:.8px;margin-bottom:auto;box-shadow:0 8px 28px #0008}
.actor{font-size:112px;filter:drop-shadow(0 12px 8px #0008);line-height:1;transform-origin:bottom;animation:enter .45s ease}.actor.right{align-self:flex-end}.actor.left{align-self:flex-start}@keyframes enter{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.dialogue{background:linear-gradient(180deg,rgba(19,35,78,.98),rgba(9,16,42,.98));border:4px solid white;border-radius:14px;padding:22px;box-shadow:0 10px 40px #000b;min-height:170px}.speaker{display:inline-block;background:var(--gold);color:#18203b;padding:5px 14px;font-weight:900;transform:skew(-8deg);margin-top:-45px}.text{font-size:1.3rem;line-height:1.5;margin:14px 0}.choices{display:grid;gap:10px}.choice,.action{border:2px solid #a8b8de;background:linear-gradient(#294c90,#172b58);color:white;padding:13px 16px;border-radius:9px;text-align:left;cursor:pointer;font-weight:700;transition:.18s}.choice:hover,.action:hover{transform:translateX(6px);border-color:var(--gold);background:linear-gradient(#3b66b9,#213d79)}
.sidebar{align-self:stretch;background:rgba(9,15,38,.9);border:2px solid #7e91bd;border-radius:12px;padding:16px;box-shadow:0 10px 38px #0008}.sidebar h3{margin:0 0 12px;color:var(--gold)}.evidence-list{display:grid;gap:9px}.evidence{padding:11px;background:#eef3ff;color:#1d2948;border-left:5px solid #4d68a8;border-radius:6px;cursor:pointer}.evidence.locked{opacity:.38;filter:grayscale(1);cursor:not-allowed}.tip{margin-top:18px;padding:12px;background:#152a55;border-radius:8px;color:#cfdbf5;font-size:.92rem}
footer{display:flex;justify-content:space-between;padding:10px 22px;background:#080d20;color:#aebddd;font-size:.85rem}.overlay{display:none;position:fixed;inset:0;z-index:20;background:rgba(3,7,18,.83);place-items:center;padding:20px}.overlay.show{display:grid}.card{max-width:680px;width:100%;background:var(--cream);color:var(--ink);border:7px solid #182957;border-radius:16px;padding:26px;box-shadow:0 0 0 4px white,0 24px 70px black}.card h2{margin-top:0;color:#b11f2c}.objection{font-size:clamp(3rem,11vw,8rem);font-weight:1000;font-style:italic;color:white;text-shadow:7px 7px 0 #b6000c,-4px -4px 0 #b6000c,0 0 24px #ffdc43;transform:rotate(-7deg);animation:slam .45s cubic-bezier(.2,1.8,.4,1)}@keyframes slam{from{transform:scale(3) rotate(-7deg);opacity:0}to{transform:scale(1) rotate(-7deg);opacity:1}}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:30;background:#101936;border:2px solid var(--gold);padding:12px 18px;border-radius:8px;display:none}.toast.show{display:block;animation:fade 2.2s forwards}@keyframes fade{0%{opacity:0;transform:translate(-50%,-12px)}15%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.progress{height:8px;background:#222d51}.progress div{height:100%;background:var(--gold);transition:width .4s}.final-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:16px 0}.result-row{background:#e2e9f7;padding:9px;border-radius:6px}.primary{border:0;background:var(--red);color:white;padding:12px 18px;border-radius:8px;font-weight:900;cursor:pointer}.secondary{border:0;background:#263d75;color:white;padding:12px 18px;border-radius:8px;font-weight:800;cursor:pointer;margin-left:8px}
@media(max-width:850px){main{grid-template-columns:1fr;padding:12px}.sidebar{order:-1;align-self:auto}.evidence-list{grid-template-columns:repeat(3,1fr)}.evidence{font-size:.8rem}.stage{min-height:560px}.actor{font-size:82px}.hud .chapter{display:none}.meter{width:115px}.text{font-size:1.08rem}}
</style>
</head>
<body>
<div class="app" id="app">
<header><div class="brand">THE PATH: ACE ORGANIC INSPECTOR<small>Scenario-based inspection training</small></div><div class="hud"><span class="chapter" id="chapter">CASE FILE</span><span>Credibility</span><div class="meter"><div id="meter"></div></div><strong id="score">100</strong></div></header>
<div class="progress"><div id="progress"></div></div>
<main>
<section class="stage"><div class="scene-title" id="sceneTitle"></div><div class="actor left" id="actor">🕵️</div><div class="dialogue"><div class="speaker" id="speaker">Narrator</div><div class="text" id="text"></div><div class="choices" id="choices"></div></div></section>
<aside class="sidebar"><h3>📁 Evidence Folder</h3><div class="evidence-list" id="evidence"></div><div class="tip" id="tip">Inspect carefully. Interviews, records and procedures work together.</div></aside>
</main>
<footer><span>Original training adaptation for internal learning</span><span>Keyboard: 1–4 to choose • E for evidence</span></footer>
</div>
<div class="overlay" id="overlay"><div id="overlayContent"></div></div><div class="toast" id="toast"></div>
<script>
const evidenceCatalog={
 osp:{name:'📄 Organic System Plan',desc:'The documented scope and practices of the organic operation.'},
 corrective:{name:'✅ Prior Corrective Actions',desc:'Records used to verify how earlier noncompliances were addressed.'},
 seed:{name:'🌱 Seed Documentation',desc:'Seed invoice, organic certificate or seed tag, matched with planting information.'},
 sample:{name:'🧪 Sampling Record',desc:'Inspector-selected sample with chain of custody and operator receipt.'},
 audit:{name:'🔍 Audit Trail',desc:'Records traced through production to test whether the system is complete.'},
 regulation:{name:'⚖️ Regulation Reference',desc:'Relevant requirements used to explain findings without becoming a consultant.'}
};
const scenes=[
{title:'Case Briefing',bg:'radial-gradient(circle at 70% 20%,#527cb2 0 12%,transparent 13%),linear-gradient(160deg,#9dd5f3 0 42%,#568b42 43% 70%,#7a5737 71%)',actor:'🕵️',speaker:'Narrator',text:'You are the inspector assigned to Bruce’s organic farm. Your mission is not to catch him out. Verify the operation thoroughly, communicate clearly, and create a pathway to compliance.',choices:[{t:'Begin the inspection',d:1,s:0}]},
{title:'Chapter 1 • Opening Meeting',bg:'linear-gradient(160deg,#9dd5f3 0 38%,#5b9149 39% 65%,#94704b 66%)',actor:'👨‍🌾',speaker:'Bruce',text:'You inspect here every year. You know the operation. We can skip the talk and get straight to the fields, right?',choices:[{t:'1. Agree and start immediately',d:1,s:-20,fb:'Familiarity can create complacency. State the purpose, timeline, prior corrective actions, records to review and the exit interview.'},{t:'2. Explain the purpose, schedule, prior actions and exit interview',d:1,s:10,unlock:'corrective',fb:'Good. A professional opening meeting establishes rapport and can reveal unexpected information.'}]},
{title:'Chapter 2 • Unexpected Information',bg:'linear-gradient(165deg,#a5daf5 0 35%,#4f893f 36% 66%,#806247 67%)',actor:'👨‍🌾',speaker:'Bruce',text:'One more thing. I added two new fields this season, but they are not yet shown in the OSP.',choices:[{t:'1. Ignore the new fields so the day stays on schedule',d:1,s:-20,fb:'OBJECTION! Efficiency is not a reason to leave changed areas unverified.'},{t:'2. End the inspection immediately',d:1,s:-15,fb:'Do not allow unexpected information to derail the entire inspection.'},{t:'3. Ask questions, inspect the fields and document the OSP discrepancy',d:1,s:10,unlock:'osp',fb:'Correct. Verify the change and use the requirements as your guide rather than jumping straight to a verdict.'}]},
{title:'Chapter 3 • Farm Tour',bg:'linear-gradient(180deg,#aadcf5 0 34%,#76ad55 35% 72%,#6c4f34 73%)',actor:'🚜',speaker:'Inner Voice',text:'The paperwork is building up. How thoroughly should you tour the farm?',choices:[{t:'1. Conduct a quick drive-by',d:1,s:-20,fb:'Physical inspection matters. You may miss fields, buildings, bins, containers and other evidence.'},{t:'2. Walk only the two new fields',d:1,s:-15,fb:'Past familiarity does not justify cutting corners elsewhere.'},{t:'3. Walk all fields and relevant facilities',d:1,s:10,fb:'Good. You resisted the pressure to cut corners.'}]},
{title:'Chapter 4 • The Boundary',bg:'linear-gradient(90deg,#6fa04a 0 48%,#d2be76 49% 52%,#55914a 53%),linear-gradient(#9fd9f5,#598c43)',actor:'🌳',speaker:'Narrator',text:'The new field has no visible buffer from a carefully maintained neighbouring property. You need information about possible material use.',choices:[{t:'1. Ask: “Have you ever seen the neighbour spraying?”',d:1,s:-10,fb:'That closed question invites a short yes or no and may limit the dialogue.'},{t:'2. Ask: “What materials are used on the neighbouring property?”',d:1,s:10,fb:'Correct. An open question encourages dialogue. Record what can and cannot be confirmed.'},{t:'3. Give Bruce a detailed solution for dealing with the neighbour',d:1,s:-15,fb:'You crossed into consulting. Explain the requirement and available guidance instead of prescribing a solution.'}]},
{title:'Chapter 5 • Sample Evidence',bg:'linear-gradient(160deg,#b6dff1 0 35%,#6e9b4c 36% 61%,#75543a 62%),repeating-linear-gradient(90deg,transparent 0 35px,#ffffff12 36px 37px)',actor:'👨‍🌾',speaker:'Bruce',text:'I saved you time. Here is a soil sample I collected before you arrived.',choices:[{t:'1. Accept the pre-pulled sample',d:1,s:-20,fb:'OBJECTION! The inspector must choose the sample and maintain a clear chain of custody.'},{t:'2. Select and collect the sample yourself, then issue a receipt',d:1,s:10,unlock:'sample',fb:'Correct. The sampling record is now added to your evidence folder.'}]},
{title:'Chapter 6 • Cross-Examination',bg:'linear-gradient(180deg,#d7e3ef 0 24%,#85663e 25% 62%,#3f2c23 63%)',actor:'👨‍🌾',speaker:'Bruce',text:'I confirm that the tomato seeds were organic and planted in the organic fields. My statement should be enough.',choices:[{t:'1. Accept the verbal statement',d:1,s:-20,fb:'Interview evidence alone does not verify the seed status and what was actually planted.'},{t:'2. PRESS: Ask for invoice, certificate or seed tag and planting records',d:1,s:10,unlock:'seed',fb:'Contradiction found. Documentation is needed to verify both seed status and planting.'},{t:'3. PRESENT EVIDENCE: Organic System Plan',d:0,s:-5,fb:'The OSP describes the system, but it does not by itself prove which seeds were purchased and planted.'}]},
{title:'Chapter 7 • Audit Trail',bg:'linear-gradient(180deg,#cbd9e6 0 20%,#9b7e56 21% 62%,#46362c 63%)',actor:'📚',speaker:'Inner Voice',text:'You traced tomatoes from field records to sales. The numbers appear plausible. Have you gone far enough?',choices:[{t:'1. Move on because the maths looks acceptable',d:1,s:-20,fb:'An audit trail is not only about whether the maths adds up. Digging deeper can reveal underlying issues.'},{t:'2. Request seed purchase and planting records to complete the trail',d:1,s:10,unlock:'audit',fb:'Correct. Explain why any missing record causes a breakdown in verification.'}]},
{title:'Final Chapter • Exit Interview',bg:'linear-gradient(180deg,#d9e6f0 0 23%,#826947 24% 62%,#3d3028 63%)',actor:'🕵️',speaker:'Inner Voice',text:'The inspection is ending. How will you conduct the exit interview?',choices:[{t:'1. Thank Bruce and leave',d:1,s:-15,fb:'Professional, but incomplete. Review the findings and create an opportunity for questions and clarification.'},{t:'2. Give Bruce detailed instructions on exactly how to fix every issue',d:1,s:-15,fb:'Appropriate technical assistance is allowed, but prescribing specific solutions can cross into consulting.'},{t:'3. Review findings, cite requirements, invite questions and point to resources',d:1,s:10,unlock:'regulation',fb:'Correct. Confirm observations, address additional information and resolve misunderstandings before closing.'}]},
{title:'Verdict',bg:'radial-gradient(circle at 50% 15%,#ffeaa1 0 8%,transparent 9%),linear-gradient(180deg,#24406d 0 30%,#6f5038 31% 70%,#241a18 71%)',actor:'⚖️',speaker:'Certifier',text:'The inspection record is complete. The court is ready to announce your result.',choices:[{t:'View final judgement',end:true,s:0}]}
];
let state={i:0,score:100,unlocked:new Set(),results:[]};
const el=id=>document.getElementById(id);
function render(){let s=scenes[state.i];el('app').style.background=s.bg;el('sceneTitle').textContent=s.title;el('chapter').textContent=`CASE ${state.i+1}/${scenes.length}`;el('actor').textContent=s.actor;el('speaker').textContent=s.speaker;el('text').textContent=s.text;el('score').textContent=state.score;el('meter').style.width=Math.max(0,state.score)+'%';el('progress').style.width=((state.i)/(scenes.length-1)*100)+'%';el('choices').innerHTML='';s.choices.forEach((c,n)=>{let b=document.createElement('button');b.className='choice';b.textContent=c.t;b.onclick=()=>choose(c);el('choices').appendChild(b)});renderEvidence()}
function choose(c){if(c.end){showFinal();return} state.score=Math.max(0,Math.min(100,state.score+c.s));if(c.unlock){state.unlocked.add(c.unlock);toast('New evidence added: '+evidenceCatalog[c.unlock].name)}if(c.s<0) showFeedback(c.fb,true,()=>advance(c.d)); else showFeedback(c.fb,false,()=>advance(c.d));state.results.push({scene:scenes[state.i].title,ok:c.s>=0,delta:c.s})}
function advance(d){state.i=Math.min(scenes.length-1,state.i+d);render()}
function showFeedback(msg,bad,next){el('overlayContent').innerHTML=bad?`<div style="text-align:center"><div class="objection">OBJECTION!</div><div class="card"><h2>Inspection challenge</h2><p>${msg}</p><button class="primary" id="continue">Continue</button></div></div>`:`<div class="card"><h2 style="color:#237244">Evidence accepted</h2><p>${msg}</p><button class="primary" id="continue" style="background:#237244">Continue</button></div>`;el('overlay').classList.add('show');el('continue').onclick=()=>{el('overlay').classList.remove('show');next()}}
function renderEvidence(){el('evidence').innerHTML='';Object.entries(evidenceCatalog).forEach(([k,v])=>{let d=document.createElement('div');let open=state.unlocked.has(k);d.className='evidence'+(open?'':' locked');d.textContent=open?v.name:'🔒 Locked evidence';d.onclick=()=>open&&showEvidence(v);el('evidence').appendChild(d)})}
function showEvidence(v){el('overlayContent').innerHTML=`<div class="card"><h2>${v.name}</h2><p>${v.desc}</p><button class="primary" id="close">Return to case</button></div>`;el('overlay').classList.add('show');el('close').onclick=()=>el('overlay').classList.remove('show')}
function toast(t){el('toast').textContent=t;el('toast').classList.remove('show');void el('toast').offsetWidth;el('toast').classList.add('show')}
function showFinal(){let rank=state.score>=90?'Sound & Sensible Master':state.score>=70?'Certified Inspector':state.score>=50?'Rookie Inspector':'Retraining Required';let icon=state.score>=90?'🏆':state.score>=70?'✅':state.score>=50?'📋':'⚠️';let rows=state.results.map(r=>`<div class="result-row">${r.ok?'✅':'❌'} ${r.scene.replace(/Chapter \d+ • |Final Chapter • /,'')}</div>`).join('');el('overlayContent').innerHTML=`<div class="card"><h2>${icon} ${rank}</h2><p><strong>Final credibility: ${state.score}%</strong></p><div class="final-grid">${rows}</div><p>The strongest inspection balances dialogue, observation and records, follows evidence through the audit trail, and closes with a clear exit interview.</p><button class="primary" id="restart">Play again</button><button class="secondary" id="print">Print result</button></div>`;el('overlay').classList.add('show');el('restart').onclick=()=>{state={i:0,score:100,unlocked:new Set(),results:[]};el('overlay').classList.remove('show');render()};el('print').onclick=()=>window.print()}
document.addEventListener('keydown',e=>{if(el('overlay').classList.contains('show'))return;if(e.key.toLowerCase()==='e'){let first=[...state.unlocked][0];if(first)showEvidence(evidenceCatalog[first]);return}let n=Number(e.key)-1;let bs=[...document.querySelectorAll('.choice')];if(n>=0&&bs[n])bs[n].click()});
render();
</script>
</body>
</html>
